{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="card shadow-sm mx-auto" style="max-width: 500px;">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">Editar Usuario: {{ usuario.nombre }}</h4>
        </div>
        <div class="card-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label>Nombre</label>
                    <input type="text" name="nombre" class="form-control" value="{{ usuario.nombre }}" required>
                </div>
                <div class="mb-3">
                    <label>Apellido</label>
                    <input type="text" name="apellido" class="form-control" value="{{ usuario.apellido }}">
                </div>
                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" class="form-control" value="{{ usuario.email }}" required>
                </div>
                <div class="mb-3">
                    <label>RUT</label>
                    <input type="text" name="rut" class="form-control" value="{{ usuario.rut }}" required>
                </div>
                <div class="mb-4">
                    <label>Asignar/Cambiar Empresa en Convenio</label>
                    <select name="empresa_convenio" class="form-select">
                        <option value="">-- Sin Empresa --</option>
                        {% for emp in empresas %}
                            <option value="{{ emp.id }}" {% if usuario.empresa_convenio and usuario.empresa_convenio.id == emp.id %}selected{% endif %}>{{ emp.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold">Guardar Cambios</button>
                <a href="{% url 'gerente_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
